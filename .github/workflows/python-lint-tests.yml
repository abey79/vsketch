name: Lint and Tests

on:
  push:
    branches:
      - master
      - release/*
  pull_request:
    branches:
      - master
      - release/*

jobs:

  ################
  # TESTS & LINT #
  ################
  tests:
    name: macOS/Linux Tests & Lint
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install Just
      uses: extractions/setup-just@v2

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install poetry
      run: pipx install --python ${{ matrix.python-version }} poetry

    - name: Install dependencies
      run: |
        python --version
        poetry config virtualenvs.in-project true
        poetry env use ${{ matrix.python-version }}
        poetry install --with docs,dev

    - name: Lint and static analysis
      run: |
        poetry run isort --check --diff vsketch vsketch_cli examples tests
        poetry run black --check --diff vsketch vsketch_cli examples tests
        poetry run mypy

    # needed for tests to work on ubuntu (libEGL.so.1)
    - name: Install EGL mesa
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update -y -qq
        sudo apt-get install -y -qq libegl1-mesa libegl1-mesa-dev

    - name: Pytest
      run: |
        poetry run pytest --runslow

  #################
  # TESTS WINDOWS #
  #################
  tests-windows:
    name: Windows Tests
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Just
      uses: extractions/setup-just@v2

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install poetry
      run: pipx install --python ${{ matrix.python-version }} poetry

    - name: Install dependencies
      run: |
        python --version
        poetry config virtualenvs.in-project true
        poetry env use ${{ matrix.python-version }}
        poetry install --with docs,dev

    - name: Pytest
      run: |
        poetry run pytest --runslow
